<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flyff Translate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
      min-width: 280px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .info {
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
    }
    kbd {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Flyff Translate</h1>
  <p class="info">
    <strong>FR → EN</strong><br><br>
    1. Sélectionnez du texte<br>
    2. Appuyez sur <kbd>Alt</kbd> gauche<br>
    3. Texte traduit!
  </p>
</body>
</html>
